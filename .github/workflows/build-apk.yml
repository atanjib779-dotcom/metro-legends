name: Build Metro Legends APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Game
        run: |
          unzip -q metro-legends-phase1.zip -d source

      - name: Prepare Android
        working-directory: source/metro-legends-phase1
        run: |
          npm install
          npm install @capacitor/core@^8 @capacitor/android@^8
          npm install -D @capacitor/cli@^8

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.metrolegends.cityofdreams',
            appName: 'Metro Legends',
            webDir: 'dist'
          };

          export default config;
          EOF

          npm run build
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: source/metro-legends-phase1/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metro-Legends-APK
          path: source/metro-legends-phase1/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
